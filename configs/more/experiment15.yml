  - name: "m5_conv_qkv_output"
    description: "M5 with conv fusion + QKV channel attention output (68.2K params, +2.2K vs M4)"
    algorithm: "m5"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 0
      fusion_type: "channel_attention"
      output_type: "qkv_channel_attention_output"
      model_scale: "normal"
    data:
      batch_size: 16

  - name: "m5_large_120k"
    description: "M5 large model with 120K parameters (123.7K params, +57.7K vs M4)"
    algorithm: "m5"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 0
      fusion_type: "channel_attention"
      output_type: "conv"
      model_scale: "large_120k"
    data:
      batch_size: 16

  # Deep fusion reference (not for 1-epoch comparison)
  - name: "m5_deepfusion_5layers"
    description: "M5 with 5-layer deep fusion (reference only, 91.6K params)"
    algorithm: "m5"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 0
      fusion_type: "deepfusion_5layers"
      output_type: "conv"
      model_scale: "normal"
    data:
      batch_size: 16
