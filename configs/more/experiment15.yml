  # bad at one epoch
  # - name: "m5_conv_channel_output"
  #   description: "M5 with conv fusion + channel attention output (77.1K params, +11.1K vs M4)"
  #   algorithm: "m5"
  #   model:
  #     num_channels: 4
  #     base_filter: 64
