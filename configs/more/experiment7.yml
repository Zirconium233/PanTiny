# Experiment 7: Second Wave Reproduction & SOTA Model Loss Validation
# Purpose: Second wave reproduction & SOTA model loss validation experiments

experiment_name: "experiment7_loss_validation"
experiment_description: "Second wave reproduction with SDFI and loss validation experiments with PanFlow and PanRestormer"

# Base configuration - shared settings for all models
base_config:
  nEpochs: 500  # Standard training epochs, 1 for quick testing
  output_dir: "../Out"
  gpu_mode: true
  save_best: true
  gpus: [0]
  threads: 4
  seed: 123
  
  # Data directories
  data_dirs:
    train:
      WV2: ../data/WV2_data/train128
      WV3: ../data/WV3_data/train128
      GF2: ../data/GF2_data/train128
    eval:
      WV2: ../data/WV2_data/test128
      WV3: ../data/WV3_data/test128
      GF2: ../data/GF2_data/test128
  
  # Full resolution data directories
  full_data_dirs:
    WV2: 
      enabled: false
      path: ../data/fullWV2_dataset
    WV3: 
      enabled: false
      path: ../data/fullWV3_dataset
    GF2: 
      enabled: false  # For quick testing
      path: ../data/fullGF2_data/train512
  
  # Data usage configuration
  data_usage:
    datasets: ["WV2", "WV3", "GF2"]  # Use all three datasets for training
    # datasets: ["WV2"]  # For quick testing, use only WV2
    usage_percent: 1.0
    data_seed: 42
    balance_datasets: true
  
  # Evaluation configuration
  evaluation:
    full_resolution_in_val: false
    full_resolution_in_test: true
    save_all_test_images: true
    test_models:
      latest: true
      bestPSNR: true
      bestSSIM: false
      bestQNR: false
  
  source_ms: ms
  source_pan: pan
  
  # Pretrain configuration
  pretrain:
    pretrained: false
    pre_sr: ""
    pre_folder: ../Out/checkpoint
  
  # Data configuration
  data:
    upsacle: 4
    batch_size: 16
    patch_size: 32
    n_colors: 4
    rgb_range: 255
    normalize: false
    
    # Data augmentation
    augmentation:
      enabled: true
      random_rotation: true
      rotation_degrees: [0, 90, 180, 270]
      random_flip: true
      flip_horizontal: true
      flip_vertical: true
      gaussian_noise: false
      noise_sigma: 0.01
      random_crop: true
      crop_scale: [0.8, 1.0]
      aug_prob: 0.5
  
  loss:
    L1:
      enabled: true
      weight: 0.8
    MEF_SSIM:
      enabled: true  
      weight: 0.5
    focal:  # Maps to newloss/NewLoss via loss.py
      enabled: true
      weight: 0.4
  
  # Optimizer configuration
  schedule:
    lr: 0.0001
    decay: 1000
    gamma: 0.1
    optimizer: ADAM
    momentum: 0.9
    beta1: 0.9
    beta2: 0.999
    epsilon: 1e-8
    alpha: 0.9
    weight_decay: 0.0001
    gclip: 0.4
    
    # Learning rate scheduling
    lr_scheduler:
      type: "cosine"
      eta_min: 1e-6
      cosine:
        T_max: 500
        eta_min: 5e-8
      step:
        step_size: 100
        gamma: 0.5
    
    # Evaluation settings
    eval_interval: 20
    save_interval: 20
    use_YCbCr: false
  
  # Advanced training options
  advanced:
    mixed_precision: false
    gradient_accumulation_steps: 1
    
    early_stopping:
      enabled: false
      patience: 50
      min_delta: 1e-6
      metric: 'PSNR'
      mode: 'max'
    
    ema:
      enabled: false
      decay: 0.999
    
    metrics:
      - 'PSNR'
      - 'SSIM'
      - 'CC'
      - 'SAM'
      - 'ERGAS'
      - 'QNR'
      - 'D_lambda'
      - 'D_s'

experiments:
  
  # SDFI Model Reproduction - 1 experiment
  - name: "SDFI_orig"
    description: "SDFI original reproduction with controlled loss configuration"
    algorithm: "sdfi"  
    model:
      num_channels: 4
      base_filter: 64
    # Using standard loss configuration: l1: 0.8, ssim: 0.5, new: 0.4
    
  # PanFlow Loss Validation Experiments - 5 experiments  
  - name: "PanFlow_l108ss05ne04"
    description: "PanFlow with l1:0.8, ssim:0.5, new:0.4"
    algorithm: "panflow"
    model:
      num_channels: 4
      base_filter: 64
    # Uses base_config loss: L1:0.8, MEF_SSIM:0.5, focal:0.4
    
  - name: "PanFlow_l11ms02ss01"
    description: "PanFlow with l1:1.0, mse:0.2, ssim:0.1"
    algorithm: "panflow"
    model:
      num_channels: 4
      base_filter: 64
    loss:
      L1:
        enabled: true
        weight: 1.0
      MSE:
        enabled: true
        weight: 0.2
      MEF_SSIM:
        enabled: true
        weight: 0.1
      focal:
        enabled: false
        weight: 0.0
        
  - name: "PanFlow_111"
    description: "PanFlow with l1:1.0, ssim:1.0, new:1.0"
    algorithm: "panflow"
    model:
      num_channels: 4
      base_filter: 64
    loss:
      L1:
        enabled: true
        weight: 1.0
      MEF_SSIM:
        enabled: true
        weight: 1.0
      focal:
        enabled: true
        weight: 1.0
        
  - name: "PanFlow_l1_only"
    description: "PanFlow with L1 loss only"
    algorithm: "panflow"
    model:
      num_channels: 4
      base_filter: 64
    loss:
      L1:
        enabled: true
        weight: 1.0
      MEF_SSIM:
        enabled: false
        weight: 0.0
      focal:
        enabled: false
        weight: 0.0
        
  - name: "PanFlow_ssim_only"
    description: "PanFlow with SSIM loss only"
    algorithm: "panflow"
    model:
      num_channels: 4
      base_filter: 64
    loss:
      L1:
        enabled: false
        weight: 0.0
      MEF_SSIM:
        enabled: true
        weight: 1.0
      focal:
        enabled: false
        weight: 0.0
        
  # PanRestormer Loss Validation Experiments - 6 experiments
  - name: "PanRestormer_l108ss05ne04"
    description: "PanRestormer with l1:0.8, ssim:0.5, new:0.4"
    algorithm: "panrestormer"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 4
      fusion_type: 'conv'
    # Uses base_config loss: L1:0.8, MEF_SSIM:0.5, focal:0.4
    
  - name: "PanRestormer_l11ms02ss01"
    description: "PanRestormer with l1:1.0, mse:0.2, ssim:0.1"
    algorithm: "panrestormer"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 4
      fusion_type: 'conv'
    loss:
      L1:
        enabled: true
        weight: 1.0
      MSE:
        enabled: true
        weight: 0.2
      MEF_SSIM:
        enabled: true
        weight: 0.1
      focal:
        enabled: false
        weight: 0.0
        
  - name: "PanRestormer_111"
    description: "PanRestormer with l1:1.0, ssim:1.0, new:1.0"
    algorithm: "panrestormer"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 4
      fusion_type: 'conv'
    loss:
      L1:
        enabled: true
        weight: 1.0
      MEF_SSIM:
        enabled: true
        weight: 1.0
      focal:
        enabled: true
        weight: 1.0
        
  - name: "PanRestormer_l1_only"
    description: "PanRestormer with L1 loss only"
    algorithm: "panrestormer"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 4
      fusion_type: 'conv'
    loss:
      L1:
        enabled: true
        weight: 1.0
      MEF_SSIM:
        enabled: false
        weight: 0.0
      focal:
        enabled: false
        weight: 0.0
        
  - name: "PanRestormer_ssim_only"
    description: "PanRestormer with SSIM loss only"
    algorithm: "panrestormer"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 4
      fusion_type: 'conv'
    loss:
      L1:
        enabled: false
        weight: 0.0
      MEF_SSIM:
        enabled: true
        weight: 1.0
      focal:
        enabled: false
        weight: 0.0
        