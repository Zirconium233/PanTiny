# Experiment 5: Model Comparison for Reference
# Purpose: Comprehensive comparison of panformer, msdnn, pannet variants for baseline reference

experiment_name: "experiment5_model_comparison_reference"
experiment_description: "Comprehensive model comparison including panformer, msdnn, pannet variants as reference baselines"

# Base configuration - shared settings for all models
base_config:
  nEpochs: 200  # Standard training epochs, 1 for quick testing
  output_dir: "../Out"
  gpu_mode: true
  save_best: true
  gpus: [0]
  threads: 4
  seed: 123
  
  # Data directories
  data_dirs:
    train:
      WV2: ../data/WV2_data/train128
      WV3: ../data/WV3_data/train128
      GF2: ../data/GF2_data/train128
    eval:
      WV2: ../data/WV2_data/test128
      WV3: ../data/WV3_data/test128
      GF2: ../data/GF2_data/test128
  
  # Full resolution data directories
  full_data_dirs:
    WV2: 
      enabled: false
      path: ../data/fullWV2_dataset
    WV3: 
      enabled: false
      path: ../data/fullWV3_dataset
    GF2: 
      enabled: false  # For quick testing
      path: ../data/fullGF2_data/train512
  
  # Data usage configuration
  data_usage:
    datasets: ["WV2", "WV3", "GF2"]  # Use all three datasets for training
    # datasets: ["WV2"]  # For quick testing, use only WV2
    usage_percent: 1.0
    data_seed: 42
    balance_datasets: true
  
  # Evaluation configuration
  evaluation:
    full_resolution_in_val: false
    full_resolution_in_test: true
    save_all_test_images: true
    test_models:
      latest: true
      bestPSNR: true
      bestSSIM: false
      bestQNR: false
  
  source_ms: ms
  source_pan: pan
  
  # Pretrain configuration
  pretrain:
    pretrained: false
    pre_sr: ""
    pre_folder: ../Out/checkpoint
  
  # Data configuration
  data:
    upsacle: 4
    batch_size: 16
    patch_size: 32
    n_colors: 4
    rgb_range: 255
    normalize: false
    
    # Data augmentation
    augmentation:
      enabled: true
      random_rotation: true
      rotation_degrees: [0, 90, 180, 270]
      random_flip: true
      flip_horizontal: true
      flip_vertical: true
      gaussian_noise: false
      noise_sigma: 0.01
      random_crop: true
      crop_scale: [0.8, 1.0]
      aug_prob: 0.5
  
  # Standard loss configuration (论文参数: L1=1.0, MSE=0.2, SSIM=0.1)
  loss:
    L1:
      enabled: true
      weight: 1.0
    MSE:
      enabled: true
      weight: 0.2
    SSIM:
      enabled: true
      weight: 0.1
  
  # Optimizer configuration
  schedule:
    lr: 0.0001
    decay: 1000
    gamma: 0.1
    optimizer: ADAM
    momentum: 0.9
    beta1: 0.9
    beta2: 0.999
    epsilon: 1e-8
    alpha: 0.9
    weight_decay: 0.0001
    gclip: 0.4
    
    # Learning rate scheduling
    lr_scheduler:
      type: "cosine"
      eta_min: 1e-6
      cosine:
        T_max: 500
        eta_min: 5e-8
      step:
        step_size: 100
        gamma: 0.5
    
    # Evaluation settings
    eval_interval: 20
    save_interval: 20
    use_YCbCr: false
  
  # Advanced training options
  advanced:
    mixed_precision: false
    gradient_accumulation_steps: 1
    
    early_stopping:
      enabled: false
      patience: 50
      min_delta: 1e-6
      metric: 'PSNR'
      mode: 'max'
    
    ema:
      enabled: false
      decay: 0.999
    
    metrics:
      - 'PSNR'
      - 'SSIM'
      - 'CC'
      - 'SAM'
      - 'ERGAS'
      - 'QNR'
      - 'D_lambda'
      - 'D_s'

# Individual experiments - Simplified model comparison with focused parameter ranges
experiments:
  
  # =================================================================
  # PanFormer Variants (Adjusted for target parameter counts)
  # =================================================================
  
  # - name: "panformer_60K"
  #   description: "PanFormer small version (actual ~66K parameters)"
  #   algorithm: "panformer"
  #   model:
  #     num_channels: 4
  #     size: "tiny"
  #     n_feats: 14  # Adjusted for ~66K parameters
  #     n_heads: 2
  #     n_blocks: 2
      
  # - name: "panformer_180K"
  #   description: "PanFormer medium version (actual ~180K parameters)"
  #   algorithm: "panformer"
  #   model:
  #     num_channels: 4
  #     size: "small"
  #     n_feats: 22  # Reduced from 26 to get closer to 180K
  #     n_heads: 2
  #     n_blocks: 2
      
  # - name: "panformer_300K"
  #   description: "PanFormer large version (actual ~300K parameters)"
  #   algorithm: "panformer"
  #   model:
  #     num_channels: 4
  #     size: "large"
  #     n_feats: 30  # Adjusted to get exactly around 300K
  #     n_heads: 4
  #     n_blocks: 2
      
  # =================================================================
  # PanNetV2 Variants (Adjusted for target parameter counts)
  # =================================================================
  
  - name: "pannetv2_60K"
    description: "PanNetV2 small version (actual ~53K parameters)"
    algorithm: "pannetv2"
    model:
      num_channels: 4
      size: "small"
      head_channels: 40  # Optimized for ~60K parameters
      body_channels: 28
      head_kernel: 7
      body_kernel: 5
      
  - name: "pannetv2_180K"
    description: "PanNetV2 medium version (actual ~180K parameters)"
    algorithm: "pannetv2"
    model:
      num_channels: 4
      size: "large"
      head_channels: 70  # Reduced from 80 to get closer to 180K
      body_channels: 52  # Reduced to get closer to 180K
      head_kernel: 9
      body_kernel: 5
      
  - name: "pannetv2_300K"
    description: "PanNetV2 large version (actual ~300K parameters)"
    algorithm: "pannetv2"
    model:
      num_channels: 4
      size: "large"
      head_channels: 90  # Reduced from 110 to get closer to 300K
      body_channels: 68  # Reduced to get closer to 300K
      head_kernel: 11
      body_kernel: 7
      
  # =================================================================
  # Original Models (Reference Implementations)
  # =================================================================
      
  - name: "msdnn_original"
    description: "Original MSDNN implementation (fixed ~2.7M parameters)"
    algorithm: "msdnn"
    model:
      num_channels: 4
      base_filter: 64  # Fixed parameter - MSDNN doesn't support size adjustment
      
  - name: "pannet_original"
    description: "Original PanNet implementation (~80K parameters)"
    algorithm: "pannet"
    model:
      num_channels: 4
      base_filter: 64  # Standard PanNet configuration  

  - name: "msdcnn_original"
    description: "Original msdcnn implementation (~220k parameters)"
    algorithm: "msdcnn"
    model:
      num_channels: 4
      base_filter: 64  # Standard PanNet configuration  
  # =================================================================
  # Cross-Model Analysis Summary
  # =================================================================
  # Target Parameter Ranges:
  # ~60K:   panformer_60K, pannetv2_60K
  # ~180K:  panformer_180K, pannetv2_180K  
  # ~300K:  panformer_300K, pannetv2_300K
  # Fixed:  msdnn_original (~2.7M), pannet_original (~80K)
  #
  # All models use unified loss: L1=1.0, MSE=0.2, SSIM=0.1

# =================================================================
# Expected Results and Analysis Goals (Simplified & Focused)
# =================================================================
# This experiment aims to:
# 1. Compare 3 different architectures (CNN, Transformer, Hybrid) at similar parameter counts
# 2. Validate parameter efficiency across different model sizes (60K, 180K, 300K)
# 3. Establish baseline performance for paper reference
# 4. Test hypothesis: simple models + good engineering achieve competitive performance
# 
# Key Metrics to Compare:
# - PSNR, SSIM, SAM, ERGAS (with labels)
# - D_lambda, D_s, QNR (without labels) 
# - Parameter count and training efficiency
#
# Unified Loss Configuration (All Models):
# - L1 Loss: weight = 1.0
# - MSE Loss: weight = 0.2  
# - SSIM Loss: weight = 0.1
# (Based on published paper parameters for fair comparison)
#
# Target Model Comparison:
# 
# 60K Parameter Group:
# - panformer_60K: Transformer approach (~60K target)
# - pannetv2_60K: Enhanced CNN approach (~60K target)
# 
# 180K Parameter Group:
# - panformer_180K: Transformer approach (~180K target)  
# - pannetv2_180K: Enhanced CNN approach (~180K target)
# 
# 300K Parameter Group:
# - panformer_300K: Transformer approach (~300K target)
# - pannetv2_300K: Enhanced CNN approach (~300K target)
# 
# Reference Models (Fixed Sizes):
# - msdnn_original: Hybrid CNN approach (~2.7M parameters - large reference)
# - pannet_original: Traditional CNN approach (~80K parameters - baseline)
#
# Analysis Framework:
# 1. Parameter Efficiency: Performance/parameter ratio analysis
# 2. Architecture Comparison: CNN vs Transformer vs Hybrid approaches
# 3. Scaling Behavior: How each architecture scales with parameter count
# 4. Training Efficiency: Convergence speed and stability
# 5. Reference Benchmarking: Comparison with traditional methods
