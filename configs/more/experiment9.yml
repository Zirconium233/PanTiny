# Experiment 9

experiment_name: "experiment9_config_changed"
experiment_description: "to find the best configuration for the models"

# Base configuration - shared settings for all models
base_config:
  nEpochs: 500  # Standard training epochs, 1 for quick testing
  output_dir: "../Out"
  gpu_mode: true
  save_best: true
  gpus: [0]
  threads: 4
  seed: 123
  
  # Data directories
  data_dirs:
    train:
      WV2: ../data/WV2_data/train128
      WV3: ../data/WV3_data/train128
      GF2: ../data/GF2_data/train128
    eval:
      WV2: ../data/WV2_data/test128
      WV3: ../data/WV3_data/test128
      GF2: ../data/GF2_data/test128
  
  # Full resolution data directories
  full_data_dirs:
    WV2: 
      enabled: false
      path: ../data/fullWV2_dataset
    WV3: 
      enabled: false
      path: ../data/fullWV3_dataset
    GF2: 
      enabled: false  # For quick testing
      path: ../data/fullGF2_data/train512
  
  # Data usage configuration
  data_usage:
    datasets: ["WV2", "WV3", "GF2"]  # Use all three datasets for training
    # datasets: ["WV2", "WV3"]
    # datasets: ["WV2"]
    usage_percent: 1.0
    data_seed: 42
    balance_datasets: false
  
  # Evaluation configuration
  evaluation:
    full_resolution_in_val: false
    full_resolution_in_test: true
    save_all_test_images: true
    test_models:
      latest: true
      bestPSNR: true
      bestSSIM: false
      bestQNR: false
  
  source_ms: ms
  source_pan: pan
  
  # Pretrain configuration
  pretrain:
    pretrained: false
    pre_sr: ""
    pre_folder: ../Out/checkpoint
  
  # Data configuration
  data:
    upsacle: 4
    batch_size: 16
    patch_size: 32
    n_colors: 4
    rgb_range: 255
    normalize: false
    
    # Data augmentation
    augmentation:
      enabled: false
      random_rotation: true
      rotation_degrees: [0, 90, 180, 270]
      random_flip: true
      flip_horizontal: true
      flip_vertical: true
      gaussian_noise: false
      noise_sigma: 0.01
      random_crop: true
      crop_scale: [0.8, 1.0]
      aug_prob: 0.5
  
  loss:
    L1:
      enabled: true
      weight: 0.8
    MEF_SSIM:
      enabled: true
      weight: 0.5
    focal:  # Maps to newloss/NewLoss via loss.py
      enabled: true
      weight: 0.4
  
  # Optimizer configuration
  schedule:
    lr: 5e-4
    decay: 1000
    gamma: 0.1
    optimizer: ADAM
    momentum: 0.9
    beta1: 0.9
    beta2: 0.999
    epsilon: 1e-8
    alpha: 0.9
    weight_decay: 0.0001
    gclip: 4 # 0.4
    
    # Learning rate scheduling
    lr_scheduler:
      type: "cosine"
      eta_min: 1e-6
      cosine:
        T_max: 500
        eta_min: 5e-8
      step:
        step_size: 100
        gamma: 0.5
    
    # Evaluation settings
    eval_interval: 20
    save_interval: 20
    use_YCbCr: false
  
  # Advanced training options
  advanced:
    mixed_precision: false
    gradient_accumulation_steps: 1
    
    early_stopping:
      enabled: false
      patience: 50
      min_delta: 1e-6
      metric: 'PSNR'
      mode: 'max'
    
    ema:
      enabled: false
      decay: 0.999
    
    metrics:
      - 'PSNR'
      - 'SSIM'
      - 'CC'
      - 'SAM'
      - 'ERGAS'
      - 'QNR'
      - 'D_lambda'
      - 'D_s'

experiments:

  - name: "panflow_orig" # sota
    description: "PanFlow original reproduction"
    algorithm: "panflow"
    model:
      num_channels: 4
      base_filter: 64
  
  - name: "pnn_orig"
    description: "Original PNN baseline (~60K parameters, control group)"
    algorithm: "pnn"
    model:
      num_channels: 4
      base_filter: 64  # Standard PanNet configuration

  - name: "pannet_orig"
    description: "Original PanNet implementation (~80K parameters)"
    algorithm: "pannet"
    model:
      num_channels: 4
      base_filter: 64  # Standard PanNet configuration  
      
  - name: "msdcnn_original"
    description: "Original msdcnn implementation (~220k parameters)"
    algorithm: "msdcnn"
    model:
      num_channels: 4
      base_filter: 64  # Standard PanNet configuration  

  - name: "panrestormer_0ds"
    description: "PanRestormer without downsampling (architecture impact test)"
    algorithm: "panrestormer"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 0
      fusion_type: "conv"
  
  - name: "panrestormer_0dsat"
    description: "PanRestormer without downsampling (architecture impact test)"
    algorithm: "panrestormer"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 0
      fusion_type: "attention"
      
  - name: "panrestormer_4dsat"
    description: "PanRestormer with attention-based fusion"
    algorithm: "panrestormer"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 4
      fusion_type: "attention"

  - name: "panrestormer_2ds"
    description: "PanRestormer with 2-level downsampling"
    algorithm: "panrestormer"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 2
      fusion_type: "conv"
  
  - name: "panrestormer_2dsat"
    description: "PanRestormer with 2-level downsampling"
    algorithm: "panrestormer"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 2
      fusion_type: "attention"

  - name: "resatten_medium"
    description: "resatten medium version (balanced parameters)"
    algorithm: "resatten"
    model:
      num_channels: 4
      base_filter: 64
      size: "medium"
      
  - name: "resatten_large"
    description: "resatten large version (increased parameters)"
    algorithm: "resatten"
    model:
      num_channels: 4
      base_filter: 64
      size: "large"



