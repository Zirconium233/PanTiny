#
# Experiment 3 Configuration: Deep Architecture vs Wide Architecture Comparison
# @Description: Compare deep residual models with wide shallow models at similar parameter counts
#

# Experiment metadata
experiment_name: "exp3"
experiment_description: "Deep vs Wide architecture comparison with residual connections"

# Base configuration (inherited by all sub-experiments)
base_config:
  nEpochs: 250  # Full training epochs for final evaluation, set to 1 for quick testing
  gpu_mode: True
  save_best: True
  gpus: [0]
  threads: 4
  seed: 123
  
  # Output directory configuration
  output_dir: ../Out
  
  # Data directories
  data_dirs:
    train:
      WV2: ../data/WV2_data/train128
      WV3: ../data/WV3_data/train128
      GF2: ../data/GF2_data/train128
    eval:
      WV2: ../data/WV2_data/test128
      WV3: ../data/WV3_data/test128
      GF2: ../data/GF2_data/test128
  
  # Full resolution data directories (only GF2 enabled)
  full_data_dirs:
    WV2: 
      enabled: false
      path: ../data/fullWV2_dataset
    WV3: 
      enabled: false
      path: ""
    GF2: 
      enabled: true # for quick testing
      path: ../data/fullGF2_data/train512
  
  # Data usage configuration
  data_usage:
    datasets: ['WV3', 'WV2', 'GF2']  # Train on all datasets
    # datasets: ['WV2']  # For quick testing, use only WV2
    usage_percent: 1.0
    data_seed: 42
    balance_datasets: True
  
  # Evaluation configuration
  evaluation:
    full_resolution_in_val: false
    full_resolution_in_test: true
    save_all_test_images: true
  
  source_ms: ms
  source_pan: pan
  
  # Pretrain configuration
  pretrain:
    pretrained: False
    pre_sr: ""
    pre_folder: ../Out/checkpoint
  
  # Data configuration
  data:
    upsacle: 4
    batch_size: 8
    patch_size: 32
    n_colors: 4
    rgb_range: 255
    normalize: False
    
    # Data augmentation
    augmentation:
      enabled: True
      random_rotation: True
      rotation_degrees: [0, 90, 180, 270]
      random_flip: True
      flip_horizontal: True
      flip_vertical: True
      gaussian_noise: False
      noise_sigma: 0.01
      random_crop: True
      crop_scale: [0.8, 1.0]
      aug_prob: 0.5
  
  # Base training schedule
  schedule:
    lr: 4e-5
    decay: 1000
    gamma: 0.1
    optimizer: ADAM
    momentum: 0.9
    beta1: 0.9
    beta2: 0.999
    epsilon: 1e-8
    alpha: 0.9
    weight_decay: 1e-4
    gclip: 0.4
    
    # Learning rate scheduling
    lr_scheduler:
      type: 'cosine'
      cosine:
        T_max: 500
        eta_min: 5e-8
      step:
        step_size: 100
        gamma: 0.5
    
    # Loss configuration (optimal from exp2)
    loss:
      primary:
        type: 'L1'
        weight: 1.0
      auxiliary:
        ssim:
          enabled: True
          weight: 0.1
        perceptual:
          enabled: True
          weight: 0.1
        frequency:
          enabled: True
          weight: 0.1
        gradient:
          enabled: True
          weight: 0.1
        edge:
          enabled: True
          weight: 0.05
    
    # Evaluation settings
    eval_interval: 20
    save_interval: 20
    use_YCbCr: False
  
  # Advanced training options
  advanced:
    mixed_precision: False
    gradient_accumulation_steps: 1
    
    early_stopping:
      enabled: False
      patience: 50
      min_delta: 1e-6
      metric: 'PSNR'
      mode: 'max'
    
    ema:
      enabled: False
      decay: 0.999
    
    metrics:
      - 'PSNR'
      - 'SSIM'
      - 'CC'
      - 'SAM'
      - 'ERGAS'
      - 'QNR'
      - 'D_lambda'
      - 'D_s'

# Architecture comparison experiments
architecture_experiments:
  # PNN baseline (control group) - keep only 300K version from exp2
  - name: "pnn_large_300k"
    description: "Large PNN baseline (~300K parameters, control group)"
    algorithm: pnnv2
    model:
      size: "large"
      hidden_dim1: 96
      hidden_dim2: 64
      kernel_size1: 11
      kernel_size2: 7
      kernel_size3: 5

  # Deep residual PNN models with different scales
  - name: "deep_pnn_small"
    description: "Deep residual PNN (~80K parameters)"
    algorithm: deeppnn
    model:
      size: "deep_small"
      hidden_dim: 20
      num_blocks: 10
      kernel_size: 3

  - name: "deep_pnn_med"
    description: "Deep residual PNN (~181K parameters)"
    algorithm: deeppnn
    model:
      size: "deep_medium"
      hidden_dim: 28
      num_blocks: 12
      kernel_size: 3

  - name: "deep_pnn_large"
    description: "Deep residual PNN (~271K parameters)"
    algorithm: deeppnn
    model:
      size: "deep_large"
      hidden_dim: 32
      num_blocks: 14
      kernel_size: 3

  - name: "deep_pnn_huge"
    description: "Deep residual PNN (~646K parameters)"
    algorithm: deeppnn
    model:
      size: "deep_huge"
      hidden_dim: 44
      num_blocks: 18
      kernel_size: 3

