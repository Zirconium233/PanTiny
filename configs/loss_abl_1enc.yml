# Experiment 20

experiment_name: "experiment20_loss_deep_exploration"
experiment_description: "Deep exploration of loss weight effects: all high, individual high, extreme SSIM variants, based on pantiny one encoder version"

# Base configuration - shared settings for all models
base_config:
  nEpochs: 1  # Standard training epochs
  output_dir: "../Out"
  gpu_mode: true
  save_best: true
  gpus: [0]
  threads: 4
  seed: 123
  
  # Data directories
  data_dirs:
    train:
      WV2: ../data/WV2_data/train128
      WV3: ../data/WV3_data/train128
      GF2: ../data/GF2_data/train128
    eval:
      WV2: ../data/WV2_data/test128
      WV3: ../data/WV3_data/test128
      GF2: ../data/GF2_data/test128
  
  # Full resolution data directories
  full_data_dirs:
    WV2: 
      enabled: false
      path: ../data/fullWV2_dataset
    WV3: 
      enabled: false
      path: ../data/fullWV3_dataset
    GF2: 
      enabled: false  # For quick testing
      path: ../data/fullGF2_data/train512
  
  # Data usage configuration
  data_usage:
    # datasets: ["WV2", "WV3", "GF2"]  # Use all three datasets for training
    datasets: ["WV2"] # debug
    usage_percent: 1.0
    data_seed: 42
    balance_datasets: false
  
  # Evaluation configuration
  evaluation:
    full_resolution_in_val: false
    full_resolution_in_test: true
    save_all_test_images: true
    test_models:
      latest: true
      bestPSNR: true
      bestSSIM: false
      bestQNR: false
  
  source_ms: ms
  source_pan: pan
  
  # Pretrain configuration
  pretrain:
    pretrained: false
    pre_sr: ""
    pre_folder: ../Out/checkpoint
  
  # Data configuration
  data:
    upsacle: 4
    batch_size: 16
    patch_size: 32
    n_colors: 4
    rgb_range: 255
    normalize: false
    
    # Data augmentation
    augmentation:
      enabled: false
      random_rotation: true
      rotation_degrees: [0, 90, 180, 270]
      random_flip: true
      flip_horizontal: true
      flip_vertical: true
      gaussian_noise: false
      noise_sigma: 0.01
      random_crop: true
      crop_scale: [0.8, 1.0]
      aug_prob: 0.5
  
  # Optimizer configuration
  schedule:
    lr: 5e-4
    decay: 1000
    gamma: 0.1
    optimizer: ADAM
    momentum: 0.9
    beta1: 0.9
    beta2: 0.999
    epsilon: 1e-8
    alpha: 0.9
    weight_decay: 0.0001
    gclip: 4 # 0.4
    
    # Learning rate scheduling
    lr_scheduler:
      type: "cosine"
      eta_min: 1e-6
      cosine:
        T_max: 500
        eta_min: 5e-8
      step:
        step_size: 100
        gamma: 0.5
    
    # Evaluation settings
    eval_interval: 20
    save_interval: 20
    use_YCbCr: false
  
  # Advanced training options
  advanced:
    mixed_precision: false
    gradient_accumulation_steps: 1
    
    early_stopping:
      enabled: false
      patience: 50
      min_delta: 1e-6
      metric: 'PSNR'
      mode: 'max'
    
    ema:
      enabled: false
      decay: 0.999
    
    metrics:
      - 'PSNR'
      - 'SSIM'
      - 'CC'
      - 'SAM'
      - 'ERGAS'
      - 'QNR'
      - 'D_lambda'
      - 'D_s'

experiments:

  # Phase 1: All losses high - test if high weights universally help
  - name: "all_high_weights"
    description: "All losses with high weights: L1=2.0 + SSIM=2.0 + Focal=2.0"
    algorithm: "panrestormer"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 0
      fusion_type: "attention"
    data:
      batch_size: 16
    loss:
      L1:
        enabled: true
        weight: 2.0
      MEF_SSIM:
        enabled: true
        weight: 2.0
      focal:
        enabled: true
        weight: 2.0

  # Phase 2: Individual high weights - isolate which loss drives improvement
  - name: "l1_only_high"
    description: "Only L1 high: L1=3.0 + SSIM=0.8 + Focal=1.0"
    algorithm: "panrestormer"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 0
      fusion_type: "attention"
    data:
      batch_size: 16
    loss:
      L1:
        enabled: true
        weight: 3.0
      MEF_SSIM:
        enabled: true
        weight: 0.8
      focal:
        enabled: true
        weight: 1.0

  - name: "focal_only_high"
    description: "Only Focal high: L1=0.8 + SSIM=0.8 + Focal=3.0"
    algorithm: "panrestormer"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 0
      fusion_type: "attention"
    data:
      batch_size: 16
    loss:
      L1:
        enabled: true
        weight: 0.8
      MEF_SSIM:
        enabled: true
        weight: 0.8
      focal:
        enabled: true
        weight: 3.0

  # Phase 3: Extreme SSIM variants - push SSIM even higher
  - name: "extreme_ssim_v2"
    description: "Higher SSIM: L1=0.8 + SSIM=5.0 + Focal=1.0"
    algorithm: "panrestormer"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 0
      fusion_type: "attention"
    data:
      batch_size: 16
    loss:
      L1:
        enabled: true
        weight: 0.8
      MEF_SSIM:
        enabled: true
        weight: 5.0
      focal:
        enabled: true
        weight: 1.0

  - name: "extreme_ssim_v3"
    description: "Ultra SSIM: L1=1.5 + SSIM=4.0 + Focal=1.5"
    algorithm: "panrestormer"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 0
      fusion_type: "attention"
    data:
      batch_size: 16
    loss:
      L1:
        enabled: true
        weight: 1.5
      MEF_SSIM:
        enabled: true
        weight: 4.0
      focal:
        enabled: true
        weight: 1.5

  - name: "extreme_ssim_v4"
    description: "Balanced extreme: L1=1.5 + SSIM=3.5 + Focal=1.5"
    algorithm: "panrestormer"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 0
      fusion_type: "attention"
    data:
      batch_size: 16
    loss:
      L1:
        enabled: true
        weight: 1.5
      MEF_SSIM:
        enabled: true
        weight: 3.5
      focal:
        enabled: true
        weight: 1.5

  # Phase 4: Reference from exp17 for comparison
  - name: "exp17_extreme_reference"
    description: "Reference from exp17: L1=0.8 + SSIM=3.0 + Focal=1.0"
    algorithm: "panrestormer"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 0
      fusion_type: "attention"
    data:
      batch_size: 16
    loss:
      L1:
        enabled: true
        weight: 0.8
      MEF_SSIM:
        enabled: true
        weight: 3.0
      focal:
        enabled: true
        weight: 1.0

  # Phase 5: Ultra extreme test - push boundaries
  - name: "ultra_extreme_ssim"
    description: "Ultra extreme: L1=0.5 + SSIM=8.0 + Focal=0.5"
    algorithm: "panrestormer"
    model:
      num_channels: 4
      base_filter: 64
      downsample_levels: 0
      fusion_type: "attention"
    data:
      batch_size: 16
    loss:
      L1:
        enabled: true
        weight: 0.5
      MEF_SSIM:
        enabled: true
        weight: 8.0
      focal:
        enabled: true
        weight: 0.5
